[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant-backend"
version = "0.1.0"
description = "Document ingestion and retrieval API with source citations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "openai>=2.45.0,<4.0.0",
  "pgvector>=0.4.1,<1.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "pypdf>=6.19.0,<7.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.12,<1",
  "pip-audit>=2.9,<3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
# Catch undefined names and syntax issues without imposing a new style on existing code.
select = ["E9", "F63", "F7", "F82"]
